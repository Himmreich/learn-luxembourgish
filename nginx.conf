server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    # La page et la liste des enregistrements : toujours à jour
    location = /index.html     { add_header Cache-Control "no-cache"; }
    location = /audio-map.json { add_header Cache-Control "no-cache"; }

    # Les enregistrements ne changent pas : cache long
    location /audio/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
